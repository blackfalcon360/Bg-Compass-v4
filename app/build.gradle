plugins {
    id 'com.android.application'
}

android {
    namespace 'bgcompass.blackfalcon.jan'
    compileSdk 34

    defaultConfig {
        applicationId "bgcompass.blackfalcon.jan"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // APK file name: "BgCompass.apk"
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "BgCompass.apk"
        }
    }
}
